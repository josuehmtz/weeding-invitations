# Base de datos local para desarrollo (gratis). En producción se usa Neon (Postgres free tier).
services:
  db:
    image: postgres:17-alpine
    container_name: invitations-db
    environment:
      POSTGRES_USER: invitations
      POSTGRES_PASSWORD: invitations_dev
      POSTGRES_DB: invitations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
