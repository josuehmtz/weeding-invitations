[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy: el navegador ve /api/* como mismo dominio (sin CORS, permite cookies httpOnly).
# Reemplaza API_URL por la URL pública de tu backend (Cloud Run / Render).
[[redirects]]
  from = "/api/*"
  to = "https://API_URL/api/:splat"
  status = 200
  force = true

# SPA: cualquier otra ruta la resuelve React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
