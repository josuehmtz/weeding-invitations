[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requiere Node 20.19+ o 22.12+.
  NODE_VERSION = "22"

# Proxy: el navegador ve /api/* como mismo dominio (sin CORS, permite cookies httpOnly).
# Destino: la API en Google Cloud Run.
[[redirects]]
  from = "/api/*"
  to = "https://invitations-api-563033774640.us-east1.run.app/api/:splat"
  status = 200
  force = true

# SPA: cualquier otra ruta la resuelve React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
